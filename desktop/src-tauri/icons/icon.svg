<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Four quadrants grid -->
  <g fill="none" stroke="white" stroke-width="8" stroke-linecap="round">
    <!-- Vertical line -->
    <line x1="256" y1="96" x2="256" y2="416"/>
    <!-- Horizontal line -->
    <line x1="96" y1="256" x2="416" y2="256"/>
  </g>

  <!-- Quadrant icons (simplified) -->
  <!-- Top-left: Important & Urgent (star) -->
  <circle cx="176" cy="176" r="40" fill="white" fill-opacity="0.9"/>

  <!-- Top-right: Important & Not Urgent (clock) -->
  <circle cx="336" cy="176" r="40" fill="white" fill-opacity="0.7"/>

  <!-- Bottom-left: Not Important & Urgent (lightning) -->
  <circle cx="176" cy="336" r="40" fill="white" fill-opacity="0.5"/>

  <!-- Bottom-right: Not Important & Not Urgent (x) -->
  <circle cx="336" cy="336" r="40" fill="white" fill-opacity="0.3"/>
</svg>
